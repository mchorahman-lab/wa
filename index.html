
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warning Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(20,15,15,.65), rgba(20,15,15,.65)),
        url("background.jpg") center/cover no-repeat;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #e4003b;
    font-size: 68px;
    font-weight: bold;
    margin-bottom: 14px;
}

.description {
    font-size: 18px;
    line-height: 1.6;
    color: #eee;
    margin-bottom: 46px;
}

button {
    background: #df001e;
    color: white;
    border: 3px solid white;
    border-radius: 11px;
    padding: 12px 17px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 5px #0005;
}

button:hover {
    background: #bd0019;
}

.secure {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 15px;
}

.shield {
    font-size: 32px;
}

@media(max-width: 450px) {
    h1 {
        font-size: 48px;
    }

    .description {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>WARNING !</h1>

    <p class="description">
        You will see nude photos and videos.<br>
        Please be discreet.<br>
        Click continue if you are 18 years old or older
    </p>

    <button onclick="continuePage()">
        CONTINUE
    </button>

    <div class="secure">
        <span class="shield">🛡️</span>
        <span>This program is verified and secure.</span>
    </div>

</div>

<script>
function continuePage() {
    window.location.href = "home.html";
}
</script>

</body>
</html>
